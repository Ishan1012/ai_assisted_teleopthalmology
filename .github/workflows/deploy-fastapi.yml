name: Deploy FastAPI to EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/fast-api/**'
      - '.github/workflows/deploy-fastapi.yml'
  workflow_dispatch:

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/clearsight-fastapi

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Build & push image to Docker Hub
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push FastAPI Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push FastAPI image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/fast-api
          file: ./backend/fast-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Job 2: Deploy to EC2 via SSH
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy FastAPI to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.fastapi.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_FASTAPI_HOST }}
          username: ${{ secrets.EC2_FASTAPI_USER }}
          key: ${{ secrets.EC2_FASTAPI_SSH_KEY }}
          source: "infra/docker-compose.fastapi.yml"
          target: "~/clearsight"
          strip_components: 1        # lands as ~/clearsight/docker-compose.fastapi.yml

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FASTAPI_HOST }}
          username: ${{ secrets.EC2_FASTAPI_USER }}
          key: ${{ secrets.EC2_FASTAPI_SSH_KEY }}
          script: |
            set -e
            cd ~/clearsight

            cat > .env <<EOF
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            FASTAPI_INTERNAL_SECRET=${{ secrets.FASTAPI_INTERNAL_SECRET }}
            MODEL_PATH=/app/notebook/best_model.pth
            EOF

            # Prune old images/containers BEFORE pulling to prevent 'no space left on device' on t3.micro
            docker system prune -af --volumes || true

            docker pull ${{ env.DOCKERHUB_IMAGE }}:latest
            docker compose -f docker-compose.fastapi.yml up -d --no-deps --force-recreate fastapi
            docker image prune -f
